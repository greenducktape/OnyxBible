name: Build APK

# Produces an installable Android APK and attaches it to a GitHub Release so it
# can be downloaded straight onto a Boox and sideloaded — no Android Studio
# needed. If the ANDROID_KEYSTORE_BASE64 secret (+ key passwords) is set, the
# release is signed with that production keystore; otherwise it falls back to
# the debug key (see android/app/build.gradle.kts), which is fine for
# sideloading but not for the Onyx store.

on:
  workflow_dispatch: # lets you trigger a fresh build by hand from the Actions tab
  push:
    branches: ["**"]

permissions:
  contents: write # required to create/update the Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Surface the keystore secret as an env var so steps can test for its
    # presence (the `secrets` context is not available in step `if:`).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Writes android/key.properties + the keystore ONLY when the secret is
      # present. build.gradle.kts then signs the release with it; without it the
      # build falls back to the debug key so contributor/CI builds still work.
      - name: Configure release signing (if secret present)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: flutter build apk --release

      # TEMPORARY — remove once the parameters are known.
      # javap gave the Neo*Pen signatures but not what their float arguments
      # MEAN, and calling drawStroke with the arguments in the wrong roles
      # produces confidently wrong ink. -l prints the LocalVariableTable, which
      # carries the real parameter names when the AAR kept debug info.
      - name: Dump Onyx pen parameter names
        if: always()
        continue-on-error: true
        run: |
          set +e
          aar=$(find ~/.gradle/caches -name 'onyxsdk-pen-*.aar' | head -1)
          echo "AAR: $aar"
          work=$(mktemp -d)
          unzip -o -q "$aar" -d "$work"
          unzip -o -q "$work/classes.jar" -d "$work/cls"
          cd "$work/cls" || exit 0
          for c in com.onyx.android.sdk.pen.NeoBrushPen \
                   com.onyx.android.sdk.pen.NeoCharcoalPen \
                   com.onyx.android.sdk.pen.NeoFountainPen \
                   com.onyx.android.sdk.pen.NeoMarkerPen \
                   com.onyx.android.sdk.pen.NeoPenUtils \
                   com.onyx.android.sdk.pen.PenUtils \
                   com.onyx.android.sdk.data.note.ShapeCreateArgs; do
            echo "########## $c"
            javap -p -l -classpath . "$c" 2>/dev/null | head -150
          done
          echo "########## TouchHelper pressure/limits"
          javap -p -classpath . com.onyx.android.sdk.pen.TouchHelper 2>/dev/null \
            | grep -i 'pressure\|max\|limit' | head -20
          exit 0

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk onyx-bible.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: onyx-bible-apk
          path: onyx-bible.apk

      # `latest` is a floating release: tag, notes and APK all move to whatever
      # was built last. `gh release create` fails the moment the tag exists, so
      # the notes have to be edited explicitly — otherwise the Releases page
      # keeps showing the commit and date of the very FIRST build forever while
      # the APK underneath quietly changes, which reads as "no new release".
      - name: Publish APK to the 'latest' Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Onyx Bible — latest build"
          NOTES="Sideload onyx-bible.apk onto your Boox.

          Built $(date -u '+%Y-%m-%d %H:%M UTC') from ${{ github.sha }} on ${{ github.ref_name }}."
          # Move the floating tag first, so the release points at this build.
          git tag -f latest
          git push -f origin latest
          gh release create latest --title "$TITLE" --notes "$NOTES" \
            || gh release edit latest --title "$TITLE" --notes "$NOTES"
          gh release upload latest onyx-bible.apk --clobber
